name: Phase 3 branch CI execution bridge

on:
  push:
    branches:
      - "phase-3/backup-restore-semantics"

permissions:
  contents: read

concurrency:
  group: daybook-phase3-finalization-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node.js 22, regression, build and Chromium
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Record runtime versions
        run: |
          node --version
          npm --version

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Run regression tests
        run: npm test

      - name: Build production application
        run: |
          npm run build
          test -s www/index.html
          test -s www/app.js
          test -s www/styles.css

      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Start built application
        run: |
          node scripts/serve-built.cjs > browser-server.log 2>&1 &
          echo $! > browser-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat browser-server.log
          exit 1

      - name: Execute Chromium browser verification
        run: node scripts/browser-verify.cjs

      - name: Upload build and browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daybook-phase3-ci-results
          path: |
            www/
            playwright-results.json
            playwright-failure.png
            browser-server.log
          if-no-files-found: warn
          retention-days: 14
