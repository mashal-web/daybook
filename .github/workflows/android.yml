name: Build Daybook Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "index.html"
      - "styles.css"
      - "native.js"
      - "package.json"
      - "capacitor.config.json"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon.svg"
      - "scripts/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: daybook-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Daybook regression checks
        run: |
          node --check app.js
          node --check sw.js
          node --check scripts/build.js
          node scripts/verify.js

      - name: Prepare web app and native plugin bundle
        run: npm run build

      - name: Verify packaged app files
        run: |
          test -s www/index.html
          test -s www/app.js
          test -s www/native.js
          test -s www/styles.css
          test -s www/manifest.webmanifest

      - name: Add Android platform
        run: npx cap add android

      - name: Add Android notification icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M12,2L3,7v10l9,5 9,-5V7zM12,5.1l5.8,3.2L12,11.5 6.2,8.3zM5,10.2l5.5,3v5.3L5,15.4zM13.5,18.5v-5.3l5.5,-3v5.2z"/>
          </vector>
          EOF

      - name: Sync Capacitor plugins
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Verify APK
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Daybook-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
