name: Build Daybook Android APK
# Final Phase 2.4 verification trigger; also runs the PWA suite for this exact commit.

on:
  workflow_dispatch:
  push:
    branches: [main, phase-2/canonical-data-compatibility]
    paths:
      - "app.js"
      - "index.html"
      - "styles.css"
      - "timetable-theme.css"
      - "upgrade.css"
      - "upgrade.js"
      - "mobile-app.css"
      - "design-system.css"
      - "study-planner.css"
      - "native.js"
      - "package.json"
      - "capacitor.config.json"
      - "manifest.webmanifest"
      - "sw.js"
      - "icon.svg"
      - "icon-192.png"
      - "icon-512.png"
      - "scripts/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

concurrency:
  group: daybook-android-build
  cancel-in-progress: true

jobs:
  build:
    name: Build and inspect Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Daybook regression checks
        run: |
          node --check app.js
          node --check sw.js
          node --check scripts/build.js
          npm test
      - name: Prepare web app and native plugin bundle
        run: npm run build
      - name: Verify packaged app files
        run: |
          for file in index.html app.js native.js styles.css timetable-theme.css upgrade.css upgrade.js mobile-app.css design-system.css study-planner.css planning.css prayer-times.js flexible-activities.js manifest.webmanifest sw.js icon-192.png icon-512.png; do
            test -s "www/$file" || { echo "Missing packaged asset: $file"; exit 1; }
          done
      - name: Add Android platform
        run: npx cap add android
      - name: Add Android notification icon
        run: |
          mkdir -p android/app/src/main/res/drawable
          cat > android/app/src/main/res/drawable/ic_stat_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M12,2L3,7v10l9,5 9,-5V7zM12,5.1l5.8,3.2L12,11.5 6.2,8.3zM5,10.2l5.5,3v5.3L5,15.4zM13.5,18.5v-5.3l5.5,-3v5.2z"/>
          </vector>
          EOF
      - name: Sync Capacitor plugins
        run: npx cap sync android
      - name: Verify native notification plugin registration
        run: |
          test -s android/app/src/main/assets/capacitor.plugins.json
          grep -q "LocalNotifications" android/app/src/main/assets/capacitor.plugins.json
          grep -R -q "LocalNotificationsPlugin" android/app/src/main
          grep -q '"@capacitor/local-notifications"' package.json
          echo "Capacitor LocalNotifications plugin is registered and native source is present."
      - name: Apply Daybook launcher icons
        run: |
          RES="android/app/src/main/res"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$density"
            cp icon-192.png "$RES/mipmap-$density/ic_launcher.png"
            cp icon-192.png "$RES/mipmap-$density/ic_launcher_round.png"
            cp icon-512.png "$RES/mipmap-$density/ic_launcher_foreground.png"
          done
          mkdir -p "$RES/mipmap-anydpi-v26"
          cat > "$RES/mipmap-anydpi-v26/ic_launcher.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cat > "$RES/mipmap-anydpi-v26/ic_launcher_round.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
      - name: Declare exact-alarm permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          if permission not in content:
              content = re.sub(r'(<manifest\b[^>]*>)', r'\1\n    ' + permission, content, count=1)
              manifest.write_text(content)
          PY
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Verify APK integrity, permissions and native plugin
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump permissions "$APK" | tee apk-permissions.txt
          grep -q "android.permission.POST_NOTIFICATIONS" apk-permissions.txt
          grep -q "android.permission.SCHEDULE_EXACT_ALARM" apk-permissions.txt
          unzip -l "$APK" | grep -q "capacitor.plugins.json"
          unzip -p "$APK" assets/capacitor.plugins.json | grep -q "LocalNotifications"
          sha256sum "$APK" | tee apk-sha256.txt
      - name: Upload installable APK and verification details
        uses: actions/upload-artifact@v4
        with:
          name: Daybook-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            apk-permissions.txt
            apk-sha256.txt
          if-no-files-found: error
          retention-days: 30
