name: Daybook Play Store AAB (signed release)

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: Android versionCode (must increase for every Play upload)
        required: true
        type: number
        default: 1
      versionName:
        description: User-visible version, e.g. 1.0.0
        required: true
        type: string
        default: 1.0.0

permissions:
  contents: read

concurrency:
  group: daybook-play-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Validate release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.DAYBOOK_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DAYBOOK_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DAYBOOK_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DAYBOOK_UPLOAD_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret for release signing: $name"
              exit 1
            fi
          done
      - name: Install dependencies and run regression tests
        run: |
          npm install --no-audit --no-fund
          node --check app.js
          node --check sw.js
          node --check scripts/build.js
          npm test
      - name: Build Capacitor web assets
        run: npm run build
      - name: Generate Android project and sync plugins
        run: |
          npx cap add android
          npx cap sync android
      - name: Configure Play release SDK, version and signing
        env:
          VERSION_CODE: ${{ inputs.versionCode }}
          VERSION_NAME: ${{ inputs.versionName }}
          KEYSTORE_B64: ${{ secrets.DAYBOOK_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DAYBOOK_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DAYBOOK_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DAYBOOK_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/daybook-upload.jks
          chmod 600 android/app/daybook-upload.jks
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          variables = Path("android/variables.gradle")
          source = variables.read_text()
          for key in ("compileSdkVersion", "targetSdkVersion"):
              source, count = re.subn(r"(?m)(\\b" + key + r"\\s*=\\s*)\\d+", r"\\g<1>36", source, count=1)
              if count != 1:
                  raise SystemExit(f"Could not set {key}=36 in generated Capacitor variables.gradle")
          variables.write_text(source)
          gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          if "signingConfigs {" not in source:
              source = source.replace("android {", """android {
    signingConfigs {
        release {
            storeFile file("daybook-upload.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }""", 1)
          release = re.search(r"(?s)(buildTypes\\s*\\{.*?release\\s*\\{)(.*?)(\\n\\s*\\})", source)
          if not release:
              raise SystemExit("Could not locate release buildType in generated Android Gradle file")
          block = release.group(1) + release.group(2)
          if "signingConfig" not in block:
              block += "\\n            signingConfig signingConfigs.release"
          source = source[:release.start()] + block + release.group(3) + source[release.end():]
          gradle.write_text(source)
          source = gradle.read_text()
          source, count = re.subn(r"(?m)(\\bversionCode\\s+)\\d+", r"\\g<1>" + os.environ["VERSION_CODE"], source, count=1)
          if count != 1:
              raise SystemExit("Could not set Android versionCode")
          source, count = re.subn(r'(?m)(\\bversionName\\s+)["\\'][^"\\']+["\\']', r'\\g<1>"' + os.environ["VERSION_NAME"] + '"', source, count=1)
          if count != 1:
              raise SystemExit("Could not set Android versionName")
          gradle.write_text(source)
          print("Release SDK 36, app version and signing configured.")
          PY
      - name: Build signed Android App Bundle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.DAYBOOK_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DAYBOOK_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DAYBOOK_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease
      - name: Verify and checksum signed AAB
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -t "$AAB"
          sha256sum "$AAB" | tee Daybook-AAB-SHA256.txt
      - name: Upload signed Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: Daybook-Play-Store-AAB-v${{ inputs.versionName }}-${{ inputs.versionCode }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            Daybook-AAB-SHA256.txt
          if-no-files-found: error
          retention-days: 30
