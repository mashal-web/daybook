name: Daybook Play Store AAB (signed release)

on:
  workflow_dispatch:
    inputs:
      versionCode:
        description: Android versionCode (must increase for every Play upload)
        required: true
        type: number
        default: 1
      versionName:
        description: User-visible version, e.g. 1.0.0
        required: true
        type: string
        default: 1.0.0

permissions:
  contents: read

concurrency:
  group: daybook-play-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Validate release signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.DAYBOOK_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DAYBOOK_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DAYBOOK_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DAYBOOK_UPLOAD_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_B64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub Actions secret for release signing: $name"
              exit 1
            fi
          done
      - name: Install dependencies and run regression tests
        run: |
          npm install --no-audit --no-fund
          node --check app.js
          node --check sw.js
          node --check scripts/build.js
          npm test
      - name: Build Capacitor web assets
        run: npm run build
      - name: Confirm privacy policy is packaged
        run: test -s www/privacy-policy.html
      - name: Generate Android project and sync plugins
        run: |
          npx cap add android
          npx cap sync android
      - name: Apply Daybook launcher and notification icons
        run: |
          RES="android/app/src/main/res"
          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "$RES/mipmap-$density"
            cp icon-192.png "$RES/mipmap-$density/ic_launcher.png"
            cp icon-192.png "$RES/mipmap-$density/ic_launcher_round.png"
            cp icon-512.png "$RES/mipmap-$density/ic_launcher_foreground.png"
          done
          mkdir -p "$RES/mipmap-anydpi-v26" "$RES/drawable"
          for name in ic_launcher ic_launcher_round; do
            cat > "$RES/mipmap-anydpi-v26/$name.xml" <<'EOF'
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/black"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          done
          cat > "$RES/drawable/ic_stat_icon.xml" <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp" android:height="24dp"
              android:viewportWidth="24" android:viewportHeight="24">
              <path android:fillColor="#FFFFFFFF"
                  android:pathData="M12,2L3,7v10l9,5 9,-5V7zM12,5.1l5.8,3.2L12,11.5 6.2,8.3zM5,10.2l5.5,3v5.3L5,15.4zM13.5,18.5v-5.3l5.5,-3v5.2z"/>
          </vector>
          EOF
      - name: Declare user-controlled exact reminder permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          source = manifest.read_text()
          permission = '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />'
          if permission not in source:
              source = re.sub(r'(<manifest\b[^>]*>)', r'\1\n    ' + permission, source, count=1)
              manifest.write_text(source)
          PY
      - name: Validate release version inputs
        env:
          VERSION_CODE: \${{ inputs.versionCode }}
          VERSION_NAME: \${{ inputs.versionName }}
        run: |
          python3 - <<'PY'
          import os, re
          code = os.environ["VERSION_CODE"]
          name = os.environ["VERSION_NAME"]
          if not code.isdigit() or int(code) < 1:
              raise SystemExit("versionCode must be a positive whole number")
          if not re.fullmatch(r"[0-9]+(?:\.[0-9]+){1,2}(?:[-+][A-Za-z0-9.-]+)?", name):
              raise SystemExit("versionName must be a simple version string such as 1.0.0")
          PY
      - name: Configure Play release SDK, version and signing
        env:
          VERSION_CODE: ${{ inputs.versionCode }}
          VERSION_NAME: ${{ inputs.versionName }}
          KEYSTORE_B64: ${{ secrets.DAYBOOK_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DAYBOOK_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DAYBOOK_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DAYBOOK_UPLOAD_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_B64" | base64 --decode > android/app/daybook-upload.jks
          chmod 600 android/app/daybook-upload.jks
          python3 - <<'PY'
          import os, re
          from pathlib import Path

          variables = Path("android/variables.gradle")
          lines = variables.read_text().splitlines()
          for key in ("compileSdkVersion", "targetSdkVersion"):
              found = False
              for i, line in enumerate(lines):
                  if re.match(r"^\s*" + key + r"\s*=", line):
                      indent = re.match(r"^\s*", line).group(0)
                      lines[i] = indent + key + " = 36"
                      found = True
                      break
              if not found:
                  raise SystemExit("Could not set " + key + " to API 36")
          variables.write_text("\n".join(lines) + "\n")

          root_gradle = Path("android/build.gradle")
          root_source = root_gradle.read_text()
          root_source, changed = re.subn(
              r"com\.android\.tools\.build:gradle:[0-9.]+",
              "com.android.tools.build:gradle:8.9.1",
              root_source, count=1
          )
          if changed != 1:
              raise SystemExit("Could not upgrade generated Android Gradle plugin to API-36-compatible 8.9.1")
          root_gradle.write_text(root_source)

          gradle = Path("android/app/build.gradle")
          source = gradle.read_text()
          if "signingConfigs {" not in source:
              source = source.replace("android {", """android {
              signingConfigs {
                  release {
                      storeFile file("daybook-upload.jks")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }""", 1)
          if "signingConfig signingConfigs.release" not in source:
              source, count = re.subn(
                  r"(?s)(buildTypes\s*\{\s*release\s*\{)",
                  r"\1\n            signingConfig signingConfigs.release",
                  source, count=1
              )
              if count != 1:
                  raise SystemExit("Could not inject signing config into release buildType")
          lines = source.splitlines()
          version_code_set = version_name_set = False
          for i, line in enumerate(lines):
              if re.match(r"^\s*versionCode\s+", line):
                  indent = re.match(r"^\s*", line).group(0)
                  lines[i] = indent + "versionCode " + os.environ["VERSION_CODE"]
                  version_code_set = True
              if re.match(r"^\s*versionName\s+", line):
                  indent = re.match(r"^\s*", line).group(0)
                  lines[i] = indent + 'versionName "' + os.environ["VERSION_NAME"] + '"'
                  version_name_set = True
          if not version_code_set or not version_name_set:
              raise SystemExit("Could not set release versionCode/versionName")
          gradle.write_text("\n".join(lines) + "\n")
          print("Configured SDK 36, AGP 8.9.1, release version and upload signing.")
          PY
      - name: Build signed Android App Bundle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.DAYBOOK_UPLOAD_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DAYBOOK_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DAYBOOK_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease
      - name: Verify and checksum signed AAB
        run: |
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          unzip -t "$AAB"
          sha256sum "$AAB" | tee Daybook-AAB-SHA256.txt
      - name: Upload signed Play bundle
        uses: actions/upload-artifact@v4
        with:
          name: Daybook-Play-Store-AAB-v${{ inputs.versionName }}-${{ inputs.versionCode }}
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            Daybook-AAB-SHA256.txt
          if-no-files-found: error
          retention-days: 30
